services:
  - type: web
    name: paimana-insight
    env: python
    plan: free
    region: oregon
    buildCommand: bash render-build.sh
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
